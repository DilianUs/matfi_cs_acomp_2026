<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" href="inicioMatfi.css" as="style">
    <link rel="stylesheet" href="inicioMatfi.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <title>Alimentación</title>
</head>
<body class="responsivo">
    <!-- Barra de navegacion -->
    <aside class="barraLateral">
        <div class="barraLateral__logo responsivo">
            <img src="asserts/logoMatFi.png">
        </div>

        <nav class="barraLateral__navegacion">
            <ul class="barraLateral__listaOpciones">
                <li class="barraLateral__elemento">
                    <a class="barraLateral__enlace responsivo">
                        <div class="barraLateral__icono"><img src="asserts/paginaPrincipal_iconos/inicioIcono.png"></div>
                        <p class="barraLateral__texto">Inicio</p>
                    </a>
                </li>

                <li class="barraLateral__elemento">
                    <a class="barraLateral__enlace responsivo">
                        <div class="barraLateral__icono"><img src="asserts/paginaPrincipal_iconos/alimentacionIcono.png"></div>
                        <p class="barraLateral__texto">Alimentación</p>
                    </a>
                </li>

                <li class="barraLateral__elemento">
                    <a class="barraLateral__enlace responsivo">
                        <div class="barraLateral__icono"><img src="asserts/paginaPrincipal_iconos/herramientasIcono.png"></div>
                        <p class="barraLateral__texto">Herramientas</p>
                    </a>
                </li>

                <li class="barraLateral__elemento">
                    <a class="barraLateral__enlace responsivo">
                        <div class="barraLateral__icono"><img src="asserts/paginaPrincipal_iconos/rutinaIcono.png"></div>
                        <p class="barraLateral__texto">Rutinas</p>
                    </a>
                </li>

                <li class="barraLateral__elemento">
                    <a class="barraLateral__enlace responsivo">
                        <div class="barraLateral__icono"><img src="asserts/paginaPrincipal_iconos/perfilIcono.png"></div>
                        <p class="barraLateral__texto">Perfil</p>
                    </a>
                </li>

                <li class="barraLateral__elemento">
                    <a class="barraLateral__enlace responsivo">
                        <div class="barraLateral__icono"><img src="asserts/paginaPrincipal_iconos/configuracionIcono.png"></div>
                        <p class="barraLateral__texto">Ajustes</p>
                    </a>
                </li>

                <li class="barraLateral__elemento barraLateral__elementoFAQ">
                    <a class="barraLateral__enlace responsivo">
                        <div class="barraLateral__icono"><img src="asserts/paginaPrincipal_iconos/FAQIcono.png"></div>
                        <p class="barraLateral__texto">Ayuda</p>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Contenido de tarjetas -->
    <main class="panelPrincipal-general panelPrincipal-alimentacion cuadricula">

        <section class="tarjeta tarjetaConsultas">
            <div class="tarjetaConsultas__contenido responsivo">
                <div class="filtrar">
                    <p>Filtrar</p>
                    <span class="flecha"></span>
                </div>

                <div class="tarjetaConsultas__busqueda responsivo">
                    <input type="text" placeholder="   ¿Qué quieres buscar?">
                    <img  class="tarjetaBienvenida__iconoBusqueda" src="asserts/paginaPrincipal_iconos/busquedaIcono.png">
                </div>
            </div>
        </section>

        <section class="tarjeta tarjetaPieDePagina tarjetaDesayuno">
            <div class="tarjetaDesayuno__Contenido">
                <div class="tarjetaDesayuno__iconos panelPrincipal-alimentacion__iconos cuadricula">
                    <img class="tarjetaDesayuno__icono1" src="asserts/paginaAlimentacion_iconos/desayuno/iconoDesayuno1.jpeg" alt="">
                    <img class="tarjetaDesayuno__icono2" src="asserts/paginaAlimentacion_iconos/desayuno/iconoDesayuno2.jpg" alt="">
                    <img class="tarjetaDesayuno__icono3" src="asserts/paginaAlimentacion_iconos/desayuno/iconoDesayuno3.jpg" alt="">

                </div>
                <h2 class="tarjeta__titulo">Desayunos</h2>
            </div>
            
        </section>

        <section class="tarjeta tarjetaPieDePagina tarjetaAlmuerzo">
            <div class="tarjetaAlmuerzo__Contenido">
                <div class="tarjetaAlmuerzo__iconos panelPrincipal-alimentacion__iconos cuadricula">
                    <img class="tarjetaAlmuerzo__icono1" src="asserts/paginaAlimentacion_iconos/almuerzo/almuerzoIcono1.jpg" alt="">
                    <img class="tarjetaAlmuerzo__icono2" src="asserts/paginaAlimentacion_iconos/almuerzo/almuerzoIcono2.jpg" alt="">
                    <img class="tarjetaAlmuerzo__icono3" src="asserts/paginaAlimentacion_iconos/almuerzo/almuerzoIcono3.jpg" alt="">
                    <img class="tarjetaAlmuerzo__icono4" src="asserts/paginaAlimentacion_iconos/almuerzo/iconoAlmuerzo4.png" alt="">
                </div>
                <h2 class="tarjeta__titulo">Almuerzos</h2>
            </div>
            
        </section>

        <section class="tarjeta tarjetaPieDePagina tarjetaCena">
            <div class="tarjetaCena__Contenido">
               <div class="tarjetaCena__iconos panelPrincipal-alimentacion__iconos cuadricula">
                    <img class="tarjetaCena__icono1" src="asserts/paginaAlimentacion_iconos/cena/cenaIcono1.jpg" alt="imagenCena">
                    <img class="tarjetaCena__icono2" src="asserts/paginaAlimentacion_iconos/cena/cenaIcono2.jpg" alt="imagenCena">
                    <img class="tarjetaCena__icono3" src="asserts/paginaAlimentacion_iconos/cena/cenaIcono3.jpg" alt="imagenCena">
                    <img class="tarjetaCena__icono4" src="asserts/paginaAlimentacion_iconos/cena/cenaIcono4.jpg" alt="">
                </div>
                <h2 class="tarjeta__titulo">Cenas</h2> 
            </div>
            
        </section>

    </main>

</body>
</html>
