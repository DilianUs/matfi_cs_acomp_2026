<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" href="../styles/inicioMatfi.css" as="style">
    <link rel="stylesheet" href="../styles/inicioMatfi.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <title>Inicio</title>
</head>
<body class="responsivo">
    <!-- Contenido de tarjetas -->
    <main class="panelPrincipal-general panelPrincipal-inicio cuadricula" id="panelPrincipal">
        <section class="tarjeta tarjetaBienvenida">
            <div class="tarjetaBienvenida__contenido responsivo">
                <div class="tarjetaBienvenida__saludo">
                    <h2 class="tarjeta__titulo">Buen día, Usuario</h2>
                    <p class="tarjeta__texto">¿Cómo te sientes hoy?</p>
                </div>

                <div class="tarjetaBienvenida__busqueda responsivo">
                    <input type="text" placeholder="   Filtrar">
                    <img  class="tarjetaBienvenida__iconoBusqueda" src="../../asserts/paginaPrincipal_iconos/busquedaIcono.png">
                    <img class="tarjetaBienvenida__iconoNotificacion tarjetaBienvenida__iconoNotificacion--activa" src="../../asserts/paginaPrincipal_iconos/sinNotificacionIcono.png">
                </div>
            </div>
        </section>

        <section class="tarjeta tarjetaEntrenamiento">
            <div>
                <h2 class="tarjeta__titulo">Historial de entrenamiento</h2>

            </div>
        </section>

        <section class="tarjeta tarjetaProgreso">
            <div>
                <h2 class="tarjeta__titulo">Progreso semanal</h2>
                
            </div>
        </section>

        <section class="tarjeta tarjetaPieDePagina tarjetaCalendario">
            <div>
                <div>
                    <h2 class="tarjeta__titulo">Calendario</h2>
                </div>
                
            </div>
        </section>

        <section class="tarjeta tarjetaPieDePagina tarjetaObjetivos">
            <div>
                <h2 class="tarjeta__titulo">Objetivos</h2>
                
            </div>
        </section>
    </main>

</body>
</html>
