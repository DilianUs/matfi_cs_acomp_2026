<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" href="../styles/Ingreso.css" as="style">
    <link rel="stylesheet" href="../styles/Ingreso.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>MatFi</title>
</head>
<body>
    <div class="contenedor grid">

        <div class="contenedor__iconos flex">
            <div class="iconos__logo">
                <img src="../../asserts/logoMatFi.png" alt="Logo Matfi">
            </div>
            <br>
            <br>  
            <div class="iconos__redes">
                <a href="" class="iconos__redes__logo"><img src="../../asserts/GoogleIcono.png"></a>
                <a href="" class="iconos__redes__logo"><img src="../../asserts/InstagramIcono.png" ></a>
                <a href="" class="iconos__redes__logo"><img src="../../asserts/FacebookIcono.png" ></a>
            </div>
        </div>

        <!-- <div class="registro"> -->
        <div class="contenedor__formulario contenedor__formulario--registro">
            <h2>Registrarse</h2>
            <div class="formulario">
                <form id="formularioRegistro" method="POST">
                    <div class="contenedor__datos">
                        <img class="formulario__icono" src="../../asserts/usuarioIcono.png" alt="usuario">
                        <input type="text" id="nombreUsuario" name="Nombre" placeholder="Nombre completo" required>
                    </div>

                    <div class="contenedor__datos">
                        <img  class="formulario__icono" src="../../asserts/correoIcono.png" alt="usuario">
                        <input type="email" id="correoElectronicoRegistro" name="Correo" placeholder="Correo electrónico" required>
                    </div>
                    <div class="contenedor__datos">
                        <img class="formulario__icono" src="../../asserts/llaveIcono.png" alt="usuario">
                        <input type="password" id="contraseniaUsuarioRegistro" name="Contraseña" placeholder="Contraseña" required>
                        <img class="formulario__icono" src="../../asserts/verContraseñaIcono.png" alt="">
                    </div>

                    <button id="btnGuardar" type="submit" class="formulario__button flex">
                        <p>Comenzar</p>
                        <img src="../../asserts/vector.png"> 
                    </button>
                </form>
            </div>

            <p class="formulario__pregunta">Ya tienes cuenta? <a href="#" id="mostrarIngreso" class="formulario__pregunta--cambiarInformacion">Inicia sesión</a></p>
        </div>

        <!-- <div class="inicio sesi{on}"> -->
        <div class="contenedor__formulario contenedor__formulario--ingreso contenedor--oculto">
            <h2>Iniciar sesión</h2>
            <div class="formulario">
                <form id="formularioInicioSesion" method="POST">
                    <div class="contenedor__datos">
                        <img  class="formulario__icono" src="../../asserts/correoIcono.png" alt="usuario">
                        <input type="email" id="correoElectronicoInicio" name="Correo" placeholder="Correo electrónico" required>
                    </div>
                    <div class="contenedor__datos">
                        <img class="formulario__icono" src="../../asserts/llaveIcono.png" alt="usuario">
                        <input type="password" id="contraseniaUsuarioInicio" name="Contraseña" placeholder="Contraseña" required>
                        <img class="formulario__icono" src="../../asserts/verContraseñaIcono.png" alt="">
                    </div>

                    <button id="btnGuardarInicio" type="submit" class="formulario__button flex">
                        <p>Comenzar</p>
                        <img src="../../asserts/vector.png"> 
                    </button>
                </form>
            </div>

            <p class="formulario__pregunta">No tienes una tienes cuenta? <a href="#" id="mostrarRegistro" class="formulario__pregunta--cambiarInformacion">Regístrate</a></p>
        </div>

        <div class="contenedor__formulario contenedor__formulario--perfil contenedor--oculto">
            <h2>Completar Perfil</h2>
            <div class="formulario">
                <form id="formularioPerfilSecuencia" method="POST">
                    <div class="contenedor__datos">
                        <select id="generoUsuarioPerfil" required style="width: 100%; border: none; outline: none; background: transparent; font-size: 1rem; color: #fff;">
                            <option value="" disabled selected>Selecciona tu género</option>
                            <option value="M" style="color: #000;">Mujer</option>
                            <option value="H" style="color: #000;">Hombre</option>
                        </select>
                    </div>
                    <div class="contenedor__datos">
                        <input type="number" id="edadUsuarioPerfil" placeholder="Edad" required>
                    </div>
                    <div class="contenedor__datos">
                        <input type="number" step="0.01" id="estaturaUsuarioPerfil" placeholder="Altura (m o cm)" required>
                    </div>
                    <div class="contenedor__datos">
                        <input type="number" step="0.1" id="pesoUsuarioPerfil" placeholder="Peso (kg)" required>
                    </div>
                    <button type="submit" class="formulario__button flex">
                        <p>Siguiente</p>
                        <img src="../../asserts/vector.png"> 
                    </button>
                </form>
            </div>
        </div>

        <div class="contenedor__formulario contenedor__formulario--meta contenedor--oculto">
            <h2>Tu Meta Física</h2>
            <div class="formulario">
                <form id="formularioMetaSecuencia" method="POST">
                    <div class="contenedor__datos">
                        <select id="tipoMeta" required style="width: 100%; border: none; outline: none; background: transparent; font-size: 1rem; color: #fff;">
                            <option value="" disabled selected>Selecciona tu objetivo</option>
                            <option value="perdida" style="color: #000;">Perder Grasa</option>
                            <option value="mantenimiento" style="color: #000;">Mantener Peso</option>
                            <option value="ganancia" style="color: #000;">Ganar Músculo</option>
                        </select>
                    </div>
                    <div class="contenedor__datos">
                        <select id="nivelActividad" required style="width: 100%; border: none; outline: none; background: transparent; font-size: 1rem; color: #fff;">
                            <option value="" disabled selected>Nivel de Actividad</option>
                            <option value="1.2" style="color: #000;">Sedentario</option>
                            <option value="1.375" style="color: #000;">Ligero</option>
                            <option value="1.55" style="color: #000;">Moderado</option>
                            <option value="1.725" style="color: #000;">Activo</option>
                        </select>
                    </div>
                    <div class="contenedor__datos">
                        <input type="date" id="fechaInicioMeta" required style="width: 100%; border: none; outline: none; background: transparent; font-size: 1rem; color: #fff;" title="Fecha de Inicio">
                    </div>
                    <div class="contenedor__datos">
                        <input type="date" id="fechaFinMeta" required style="width: 100%; border: none; outline: none; background: transparent; font-size: 1rem; color: #fff;" title="Fecha de Fin">
                    </div>
                    <button type="submit" class="formulario__button flex">
                        <p>Finalizar</p>
                        <img src="../../asserts/vector.png"> 
                    </button>
                </form>
            </div>
        </div>
    </div>
        
    <script src="../AccesoControlador.js"></script>
    <script type="module" src="../../controlador/CuentaUsuarioControlador.js"></script>
</body>
</html>
