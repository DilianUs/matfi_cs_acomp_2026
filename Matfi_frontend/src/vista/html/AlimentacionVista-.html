<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" href="../styles/inicioMatfi.css" as="style">
    <link rel="stylesheet" href="../styles/inicioMatfi.css">

    <link rel="preload" href="../styles/configuracionInicial.css" as="style">
    <link rel="stylesheet" href="../styles/configuracionInicial.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <title>Alimentación</title>
</head>
<body class="responsivo">
    <!-- Barra de navegacion -->
    <!-- Contenido de tarjetas -->
    <main class="panelPrincipal-general panelPrincipal-alimentacion cuadricula" id="panelPrincipal-alimentacion">

        <section class="tarjeta tarjetaConsultas">
            <div class="tarjetaConsultas__contenido responsivo">
                <div class="filtrar" id="btnFiltrar">
                  
                </div>

                <div class="tarjetaConsultas__busqueda responsivo">
                    <input type="text" id="inputBusquedaRecetas" placeholder="   Buscar por nombre o ingrediente...">
                    <img class="tarjetaBienvenida__iconoBusqueda" src="../../asserts/paginaPrincipal_iconos/busquedaIcono.png">
                </div>
            </div>
        </section>

        <section class="rutinasPorNivel__contenedor rutinasPorNivel" style="grid-column: 1 / -1; display: flex; flex-direction: column; height: calc(100vh - 200px);">
            <div class="rutinasPorNivel__encabezado responsivo">
                <h2 style="color: black;" class="tarjeta__titulo">Catálogo de Recetas</h2>
                <p class="tarjeta__texto" id="contadorRecetas">Cargando recetas...</p>
            </div>

            <div class="listaRutinas__contenedor cuadricula" id="listaTodasRecetas" style="overflow-y: auto; padding-right: 10px; flex-grow: 1; align-content: start;">
                <!-- Recetas renderizadas dinámicamente -->
            </div>
        </section>

    </main>

    <!-- modal para la informacion del ejercicio -->
     <div class=" modalInfoReceta contenedorGeneralModal responsivo" id="modalAlimentacion">
        <div class=" modalInfoReceta__contenido">
            <div class="contenedorCerrarModal"><span class="iconoCerrar posicionIcono" id="btnCerrarModal"></span></div>

            <div class="modalContenedorEncabezado responsivo">
                

                <img id="imagenReceta" class="modalReceta_imagen" src="">
                <div class="modalContenedorTitulo">
                    <div class="modalTitulo__contenido responsivo">
                        <h2 class="tarjeta__titulo" id="tituloReceta"></h2>
                        <img class="iconoModal" src="../../asserts/paginaAlimentacion_iconos/modalIconos/nombreRecetaIcono.png">
                    </div>
                    <p id="descripcionReceta">Una opción saludable, balanceada y deliciosa que combina posho y demas cosas</p>
                </div>

                <div class="modalCaloriasAprox__contenedor responsivo">
                    <div class="modalCaloriasAprox__Contenido responsivo formularioModal__labelContenedor">
                        <div class="contenedorCalorias responsivo">
                            <img class="iconoModal" src="../../asserts/paginaCalculadora_iconos/resultadoIcono.png">
                            <span class="textoCaloriasAproximadas" id="caloriasReceta"></span>
                        </div>
                        
                        <p class="tarjeta_texto">kcal aprox</p>
                    </div>
                </div>
                
                <!-- <span class="iconoCerrar" id="cerrarModal"></span> -->
            </div>

            <div class="modalReceta_ContenedorInformacion cuadricula">
                <div class="modalReceta_ingredientesContenido">
                    <div  class="modalReceta_subtitulo tarjetaVistaCalculadora__encabezado responsivo">
                        <img class="iconoModal" src="../../asserts/paginaAlimentacion_iconos/modalIconos/ingredientesIcono.png">
                        <h3 class="tarjeta__titulo">Ingredientes</h3>
                    </div>

                    <!-- <div>
                        <li id="ingredientesReceta">
                            
                        </li>
                    </div> -->
                    <ul class="listaIngredientes responsivo" id="ingredientesReceta">

                    </ul>
                </div>

                <div class="modalReceta_preparacionContenido">
                    <div  class="modalReceta_subtitulo tarjetaVistaCalculadora__encabezado responsivo">
                        <img class="iconoModal" src="../../asserts/paginaAlimentacion_iconos/modalIconos/preparacionIcono.png">
                        <h3 class="tarjeta__titulo">Preparación</h3>
                    </div>

                    <ol class="listaPreparacion responsivo" id="preparacionReceta">

                    </ol>

                    <!-- <div>
                        <li id="preparacionReceta">
                            
                        </li>
                        
                    </div> -->
                </div>

                <div class="modalCaloriasAprox__contenedor modalBotonConsumo__contenedor responsivo">
                    <button  class="botonAgregarConsumo" id="btnAgregarConsumo">Agregar consumo</button>
                </div>
            </div>
            
        </div>
    </div>

</body>
</html>
